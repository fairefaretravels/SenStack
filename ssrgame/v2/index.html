<style>
:root{--bg:#05070a;--cd:#0d1117;--bd:#2a2f38;--tx:#f2f0e9;--mu:#a9a9a2;--ac:#d9a441;--ok:#7bc47f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
body{padding:14px}button{font:inherit;cursor:pointer;touch-action:manipulation}
.w{width:100%;max-width:620px;margin:auto}
header{border-bottom:1px solid var(--bd);padding:8px 0 14px;margin-bottom:14px}
h1{margin:0;font-size:20px;letter-spacing:.04em}.sub{margin-top:5px;color:var(--mu);font-size:12px}
.cab{position:relative;width:100%;aspect-ratio:480/300;overflow:hidden;border:1px solid var(--bd);border-radius:18px;background:#090d12;box-shadow:0 18px 50px rgba(0,0,0,.45)}
#cv{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;top:10px;width:52px;height:72px;border:1px solid #3b414a;border-radius:10px;background:linear-gradient(#161b22,#090c10);box-shadow:inset 0 0 15px rgba(0,0,0,.8)}
#leftMirror{left:8px}#rightMirror{right:8px}
.mirrorGlass{width:100%;height:100%;display:grid;place-items:center;color:#69717b;font-size:8px}
#mir{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:5px 10px;border:1px solid #303741;border-radius:20px;background:#080b0e;color:#777;font-size:9px;letter-spacing:.08em}
#mir.on{color:var(--ok);border-color:#49684d}
#dash{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);width:68%;height:55px;border:1px solid #292f37;border-radius:12px;background:linear-gradient(#171c23,#080b0f);display:flex;align-items:center;justify-content:space-around;box-shadow:0 -12px 30px rgba(0,0,0,.5)}
#spd{min-width:55px;text-align:center;font-size:20px;font-weight:bold}
#tun{min-width:120px;text-align:center;color:var(--mu);font-size:10px;line-height:1.3}
#wheel{position:absolute;bottom:7px;left:12px;width:78px;height:78px;transition:transform .08s linear}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.ctrl{min-height:44px;border:1px solid var(--bd);border-radius:10px;background:#10151c;color:var(--tx);font-weight:bold}
.ctrl:active{transform:scale(.97);background:#191f27}.ctrl.primary{border-color:#675027;color:var(--ac)}
.ctrl:disabled{opacity:.35;cursor:not-allowed}
.panel{margin-top:12px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--cd)}
.hidden{display:none!important}
.panelTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.panelTitle h2{margin:0;font-size:16px}
.small{color:var(--mu);font-size:11px}
.artistGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.artistCard{overflow:hidden;border:1px solid var(--bd);border-radius:12px;background:#090c11}
.artistCard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#15191f}
.artistInfo{padding:9px}.artistName{font-weight:bold;font-size:13px}.artistMeta{margin-top:3px;color:var(--mu);font-size:10px}
.artistBtn{width:100%;margin-top:8px;padding:8px;border:1px solid #3b4149;border-radius:8px;background:#141920;color:var(--tx)}
#detail img{width:100%;max-height:230px;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
#name{margin:12px 0 4px;font-size:21px}#desc{color:var(--mu);font-size:12px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.stat,.ledgerBox{padding:9px;border:1px solid var(--bd);border-radius:9px;background:#090c10}
.statLabel,.ledgerLabel{color:var(--mu);font-size:9px}.statValue{margin-top:3px;font-size:14px;font-weight:bold}
.barWrap{margin-top:12px}.barLabel{display:flex;justify-content:space-between;color:var(--mu);font-size:10px;margin-bottom:4px}
.bar{height:7px;border-radius:20px;background:#20252c;overflow:hidden}.barFill{height:100%;width:0;background:var(--ac);transition:width .25s}
#songs{display:grid;gap:6px;margin-top:12px}
.song{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:#090c10}
.songTitle{min-width:0;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songBtn{flex:0 0 auto;padding:6px 9px;border:1px solid #3a414a;border-radius:7px;background:#141920;color:var(--tx);font-size:10px}
.detailButtons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.detailButtons button{min-height:40px;border:1px solid var(--bd);border-radius:9px;background:#12171d;color:var(--tx)}
.detailButtons .gold{color:var(--ac);border-color:#65502b}
.status{margin-top:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#090c10}
#status{font-size:12px;line-height:1.45}#dtx{margin-top:5px;color:var(--mu);font-size:10px}
.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.ledgerValue{margin-top:3px;font-weight:bold;font-size:13px}
.startRow{margin-top:10px}
#start{width:100%;min-height:48px;border:1px solid #6a5225;border-radius:10px;background:#15130d;color:var(--ac);font-weight:bold}
#start:disabled{opacity:.35}
</style></head><body><div class="w">
<header><h1>DRIVEWISE</h1><div class="sub">Promotion & Distribution — Billboard Drive</div></header>
<section class="cab">
<canvas id="cv" width="480" height="300"></canvas>
<div class="side" id="leftMirror"><div class="mirrorGlass">LEFT</div></div>
<div class="side" id="rightMirror"><div class="mirrorGlass">RIGHT</div></div>
<div id="mir">◉ OFF AIR</div>
<svg id="wheel" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#10151b" stroke="#666" stroke-width="5"/><circle cx="50" cy="50" r="10" fill="#1a2027" stroke="#777" stroke-width="3"/><path d="M50 40 L50 10" stroke="#777" stroke-width="7" stroke-linecap="round"/><path d="M43 54 L19 70" stroke="#777" stroke-width="7" stroke-linecap="round"/><path d="M57 54 L81 70" stroke="#777" stroke-width="7" stroke-linecap="round"/></svg>
<div id="dash"><div id="spd">0</div><div id="tun">NO SIGNAL</div></div>
</section>
<div class="controls">
<button class="ctrl" id="L">◀ LEFT</button><button class="ctrl primary" id="B">BRAKE</button><button class="ctrl primary" id="G">GAS</button><button class="ctrl" id="R">RIGHT ▶</button>
</div>
<section class="panel hidden" id="radioPanel"><div class="panelTitle"><h2>8 Mile Radio</h2><div class="small">Independent Artist Discovery</div></div><div id="artists" class="artistGrid"></div></section>
<section class="panel hidden" id="detail">
<img id="artistPhoto" src="" alt="Artist"><h2 id="name"></h2><div id="desc"></div>
<div class="stats"><div class="stat"><div class="statLabel">SPINS</div><div class="statValue" id="aspin">0</div></div><div class="stat"><div class="statLabel">FANS</div><div class="statValue" id="afans">0</div></div><div class="stat"><div class="statLabel">SALES</div><div class="statValue" id="asales">0</div></div></div>
<div class="barWrap"><div class="barLabel"><span>EXPOSURE</span><span id="exposureText">0%</span></div><div class="bar"><div class="barFill" id="exposureBar"></div></div></div>
<div class="barWrap"><div class="barLabel"><span>DEMAND</span><span id="demandText">0%</span></div><div class="bar"><div class="barFill" id="demandBar"></div></div></div>
<div id="songs"></div>
<div class="detailButtons"><button id="play" class="gold">DRIVE TRACK</button><button id="cat" class="gold">DRIVE CATALOG</button><button id="back">BACK</button></div>
</section>
<section class="status"><div id="status">Parked. Start the drive to begin.</div><div id="dtx">Select an artist at 8 Mile Radio.</div>
<div class="ledger"><div class="ledgerBox"><div class="ledgerLabel">CASH</div><div class="ledgerValue">$<span id="cash">0</span></div></div><div class="ledgerBox"><div class="ledgerLabel">GROSS</div><div class="ledgerValue">$<span id="gross">0</span></div></div><div class="ledgerBox"><div class="ledgerLabel">TOTAL SPINS</div><div class="ledgerValue"><span id="totalSpins">0</span></div></div></div>
<div class="startRow"><button id="start">START DRIVE</button></div></section>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=480,H=300,HY=128,K=250,CAMH=1.25,LEN=600,RZ=130,NEAR=1.9,AC="#d9a441",CL=40,NC=4,RW=3.6;
const f=v=>ctx.fillStyle=v;

/* ---------- RADIO BUTTON: created BEFORE its single click handler ---------- */
const radioButton=document.createElement("button");
radioButton.id="radio";radioButton.className="ctrl primary";radioButton.textContent="RADIO";radioButton.disabled=true;
document.querySelector(".controls").appendChild(radioButton);

/* ---------- ARTISTS (filenames encoded with encodeURIComponent) ---------- */
const MUSIC_BASE="https://fairefaretravels.github.io/SenStack/ssrgame/assets/music/";
function musicURL(filename){return MUSIC_BASE+encodeURIComponent(filename)}
const mk=(t,fn)=>({title:t,file:fn});
const ARTISTS=[{display:"Mackinthedark",photo:"./assets/photos/Mitd.PNG",
description:"Detroit-rooted independent music and catalog discovery.",fans:1200,sales:240,
songs:[mk("Get Up","Get Up.mp3"),mk("ALL DAT ***","ALL DAT ASS.mp3"),mk("Love & Co - Alexa","Love & Co - Alexa.mp3"),mk("Love & Co - TRY","Love & Co - TRY.mp3"),mk("Alright","Alright.mp3"),mk("Birds","Birds.mp3"),mk("Birds","Birds.mp3"),mk("Disclaimer","Disclaimer.mp3"),mk("drive-me-crazy","drive-me-crazy-(remastered).mp3"),mk("Baby Tonight","Baby Tonight .mp3"),mk("4-X-4","4-x-4-2-(remastered)a.mp3")]}];

/* Edit to match your Detroit locations (z is road distance within one 600-unit lap) */
const LAND=[{z:75,n:"Fox Theatre"},{z:215,n:"Campus Martius"},{z:340,n:"Comerica Park"},{z:480,n:"Penobscot Building"}];

let S={z:2,x:0,v:0,steer:0,cruise:0,cash:0,gross:0,spins:0,rotation:[],driving:false,menu:false,run:null,bbs:[],artist:null,selectedSong:null,waitingForNextSong:false,currentBoard:null,t:.12,toast:null};
let T=0,N=0,DK=1,FA=1,SKY;

/* ---------- AUDIO: one Audio object, one listener per event ---------- */
const AUD=new Audio();AUD.preload="auto";AUD.loop=false;AUD.volume=.8;
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const isSilent=()=>!AUD.getAttribute("src")||AUD.src===SILENT;
AUD.addEventListener("error",()=>{
 if(isSilent())return;
 console.error("AUDIO ERROR");console.error("Audio source:",AUD.src);console.error("Audio error:",AUD.error);
 $("tun").textContent="Audio unavailable";$("mir").textContent="◉ AUDIO ERROR";$("mir").classList.remove("on");
 /* do NOT advance the catalog or spawn a billboard */
});
AUD.addEventListener("canplay",()=>{if(!isSilent())console.log("AUDIO READY:",AUD.src)});
AUD.addEventListener("play",()=>{if(!isSilent())console.log("AUDIO PLAYING:",AUD.src)});
AUD.addEventListener("pause",()=>{if(!isSilent())console.log("AUDIO PAUSED:",AUD.src)});

/* THE ONLY PLACE THAT CREATES THE NEXT CATALOG BILLBOARD.
   It does NOT start the next song — the player must drive through the billboard. */
AUD.addEventListener("ended",()=>{
 if(isSilent())return;
 console.log("AUDIO ENDED:",AUD.src);console.log("SONG FINISHED");
 if(!S.run)return;
 const run=S.run;
 $("mir").textContent="◉ OFF AIR";$("mir").classList.remove("on");
 $("tun").textContent="Next billboard loading…";
 S.bbs=[];
 if(!run.auto){S.waitingForNextSong=false;return}
 const ni=run.currentIndex+1;
 if(ni>=run.list.length){S.waitingForNextSong=false;endRun("Catalog complete. Every track received a spin.");return}
 run.currentIndex=ni;
 S.bbs=[{z:S.z+45,i:ni,done:false}]; /* exactly one billboard */
 S.waitingForNextSong=false;
 $("dtx").textContent=`Next billboard ahead: "${run.list[ni].title}". Drive through it to start the song.`;
});

function playArtistSong(a,song){
 if(!song||!song.file){console.error("Missing audio file:",song);return}
 a.spins=(a.spins||0)+1;S.spins++;
 a.exposure=Math.min(100,(a.exposure||0)+8);a.demand=Math.min(100,(a.demand||0)+5);
 $("totalSpins").textContent=S.spins;updateArtistStats(a);
 if(!S.rotation.includes(a.display))S.rotation.push(a.display);
 S.nowPlaying={a,song};S.audioBlocked=false;
 $("status").textContent=`ON AIR: ${a.display} — ${song.title}`;
 AUD.pause();try{AUD.currentTime=0}catch(e){}
 AUD.src=musicURL(song.file);AUD.loop=false;AUD.volume=.8;AUD.load();
 console.log("NOW PLAYING:",song.title);console.log("AUDIO FILE:",song.file);console.log("AUDIO URL:",AUD.src);
 const pb=AUD.play();
 if(pb)pb.catch(err=>{
  console.error("AUDIO PLAY ERROR:",err);
  /* do NOT advance the catalog or spawn a billboard; keep state intact */
  if(err&&err.name==="NotAllowedError"){S.audioBlocked=true;$("tun").textContent="Tap DRIVE again to enable audio.";$("status").textContent="Tap DRIVE again to enable audio."}
 });
 $("mir").textContent="◉ ON AIR";$("mir").classList.add("on");
 $("tun").textContent=`${a.display} • ${song.title}`;
}
/* Safari blocked playback? Any tap retries the current song. */
document.addEventListener("pointerdown",()=>{
 if(!S.audioBlocked||isSilent())return;
 S.audioBlocked=false;
 const pb=AUD.play();
 if(pb)pb.then(()=>{const n=S.nowPlaying;if(n){$("tun").textContent=`${n.a.display} • ${n.song.title}`;$("status").textContent=`ON AIR: ${n.a.display} — ${n.song.title}`}}).catch(()=>{S.audioBlocked=true});
});

function updateArtistStats(a){
 if(!a)return;
 $("aspin").textContent=a.spins||0;
 $("afans").textContent=Math.round((a.fans||0)+(a.spins||0)*3);
 $("asales").textContent=Math.round((a.sales||0)+(a.spins||0)*1.5);
 const e=Math.min(100,a.exposure||0),d=Math.min(100,a.demand||0);
 $("exposureBar").style.width=e+"%";$("demandBar").style.width=d+"%";
 $("exposureText").textContent=Math.round(e)+"%";$("demandText").textContent=Math.round(d)+"%";
}

/* ---------- ARTIST / SONG UI ---------- */
function renderArtists(){
 $("artists").innerHTML="";
 ARTISTS.forEach((a,i)=>{const c=document.createElement("div");c.className="artistCard";
 c.innerHTML=`<img src="${a.photo}" alt="${a.display}"><div class="artistInfo"><div class="artistName">${a.display}</div><div class="artistMeta">${a.songs.length} tracks</div><button class="artistBtn" data-index="${i}">VIEW CATALOG</button></div>`;
 $("artists").appendChild(c)});
}
$("artists").addEventListener("click",e=>{const b=e.target.closest(".artistBtn");if(b)openArtist(ARTISTS[+b.dataset.index])});
function openArtist(a){
 if(!a)return;S.artist=a;S.menu=true;
 $("radioPanel").classList.add("hidden");$("detail").classList.remove("hidden");
 $("artistPhoto").src=a.photo;$("name").textContent=a.display;$("desc").textContent=a.description||"";
 renderSongs(a);updateArtistStats(a);
}
function renderSongs(a){
 $("songs").innerHTML="";
 (a.songs||[]).forEach((s,i)=>{const r=document.createElement("div");r.className="song";
 r.innerHTML=`<div class="songTitle">${i+1}. ${s.title}</div><button class="songBtn" data-song="${i}">DRIVE</button>`;$("songs").appendChild(r)});
}
$("songs").addEventListener("click",e=>{
 const b=e.target.closest(".songBtn");if(!b||!S.artist)return;
 const i=+b.dataset.song;S.selectedSong=S.artist.songs[i];launch(S.artist,i,false);
});
$("play").onclick=()=>{const a=S.artist;if(!a)return;let i=a.songs.indexOf(S.selectedSong);if(i<0)i=0;launch(a,i,false)};
$("cat").onclick=()=>{if(S.artist)launch(S.artist,0,true)};

/* ---------- RUN / BILLBOARD LOGIC ---------- */
function launch(a,startIndex,auto){
 const list=a.songs&&a.songs.length?a.songs:[];
 if(!list.length){$("status").textContent="This artist has no tracks.";return}
 AUD.pause();
 S.run={a,list,n:list.length,auto,currentIndex:startIndex};
 S.waitingForNextSong=false;S.currentBoard=null;
 S.bbs=[{z:S.z+30,i:startIndex,done:false}]; /* ONE billboard only */
 S.cruise=14;S.menu=false;
 $("detail").classList.add("hidden");$("radioPanel").classList.add("hidden");
 const song=list[startIndex];
 $("status").textContent=auto?`Driving ${a.display}'s catalog.`:`Driving "${song.title}".`;
 $("dtx").textContent=`Billboard ahead for "${song.title}". Pass the billboard to start the song.`;
}
function passBoard(board){
 if(!S.run||!board||board.done)return;
 const run=S.run,song=run.list[board.i];if(!song)return;
 board.done=true;S.currentBoard=board;
 playArtistSong(run.a,song);
 S.bbs=[]; /* billboard disappears */
 if(run.auto){S.waitingForNextSong=true;
  $("dtx").textContent=`Now playing "${song.title}". The next billboard appears when the song finishes.`}
 else{S.waitingForNextSong=false;S.run=null; /* frees the radio again; keep driving */
  $("dtx").textContent=`"${song.title}" is playing. Keep driving.`}
}
function endRun(m){
 S.bbs=[];S.waitingForNextSong=false;AUD.pause();S.run=null;
 $("mir").textContent="◉ OFF AIR";$("mir").classList.remove("on");$("tun").textContent="8 Mile Radio";
 $("status").textContent=m;$("dtx").textContent="Catalog complete. You can continue driving.";
}
$("back").onclick=()=>{$("detail").classList.add("hidden");S.menu=false;$("status").textContent="Back on the road."};
radioButton.onclick=()=>{ /* the ONLY radio handler */
 if(radioButton.disabled||!S.driving||S.run)return;
 S.menu=true;$("radioPanel").classList.remove("hidden");$("detail").classList.add("hidden");
 $("status").textContent="8 Mile Radio — choose an artist.";
 $("dtx").textContent="Choose an artist, then drive through the billboard.";
};
$("start").onclick=()=>{
 if(S.driving)return;S.driving=true;$("start").disabled=true;
 AUD.src=SILENT;const p=AUD.play();if(p)p.catch(()=>{}); /* unlock audio for iOS */
 $("status").textContent="Driving. Find 8 Mile Radio.";$("dtx").textContent="Use GAS to move toward 8 Mile Radio.";
};

/* ---------- CONTROLS ---------- */
const hold=(id,d)=>{const b=$(id);b.addEventListener("pointerdown",()=>S.steer=d);
 ["pointerup","pointerleave","pointercancel"].forEach(e=>b.addEventListener(e,()=>{if(S.steer===d)S.steer=0}))};
hold("L",-1);hold("R",1);
$("G").addEventListener("pointerdown",()=>{S.cruise=Math.min(20,S.cruise+3)});
$("B").addEventListener("pointerdown",()=>{S.cruise=Math.max(0,S.cruise-5)});
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")S.steer=-1;if(e.key==="ArrowRight")S.steer=1;
 if(e.key==="ArrowUp")S.cruise=Math.min(20,S.cruise+1);if(e.key==="ArrowDown")S.cruise=Math.max(0,S.cruise-2)});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight")S.steer=0});

/* ============================================================
   WORLD: seeded chunks, recycled as you drive
============================================================ */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b,c)=>((Math.imul(a+1,73856093)^Math.imul(b+3,19349663)^Math.imul(c+7,83492791))>>>0)%97/97;
const CH={};
const BC=[[112,84,72],[84,92,104],[122,108,88]],SG=[[230,90,70],[80,190,220],[240,190,70]];
const CARS=[[150,40,40],[40,70,130],[190,190,190],[30,30,34],[70,110,80],[200,160,60]];
const CT=[{w:1.6,h:1.35},{w:1.8,h:1.75},{w:2.2,h:2.9}];
function gen(ci){
 const r=rng((ci%15)*7919+13),o=[],z0=ci*CL,cz=ci%15*CL;
 const lm=LAND.find(L=>L.z>=cz&&L.z<cz+CL);
 for(const sd of[-1,1]){
  for(let i=0;i<4;i++)o.push({t:"tree",lx:sd*(5+r()*2),z:z0+r()*CL,s:.7+r()*.9,k:r()*6.28,v:r()*3|0,g:r()});
  for(let i=0;i<2;i++)o.push({t:"lamp",lx:sd*4.7,z:z0+i*20+(sd>0?0:10),th:.25+r()*.4,fl:r()<.12,k:r()*6,sd});
  o.push({t:"pole",lx:sd*5.2,z:z0+6+(sd>0?3:0),sd});
  let z=z0;
  while(z<z0+CL){const w=3+r()*4;o.push({t:"bld",lx:sd*(7.4+w/2+r()*1.5),z:z+w/2,w,h:3+r()*(r()<.2?12:5),c:r()*3|0,k:r()*1e3|0});z+=w+.4+r()*1.2}
  const q=r();
  if(q<.3)o.push({t:"bus",lx:sd*4.3,z:z0+8+r()*20,sd});

 else{const dz=RZ+9-S.z;if(dz>NEAR&&dz<150)items.push({dz,b:1,f:()=>dBoard(dz,ARTISTS[0],"8 Mile Radio","Independent Artist Discovery",dz<40)})}

 FA=1;ctx.globalAlpha=1;

 const hz=ctx.createLinearGradient(0,HY-25,0,HY+45);const bt=SKY[1];

 if(N>.15){const hl=ctx.createLinearGradient(0,H-30,0,HY+15);hl.addColorStop(0,`rgba(255,240,190,${.3*N})`);hl.addColorStop(1,"rgba(255,240,190,0)");
  f(hl);ctx.beginPath();ctx.moveTo(W/2-70,H-30);ctx.lineTo(W/2-12,HY+15);ctx.lineTo(W/2+12,HY+15);ctx.lineTo(W/2+70,H-30);ctx.fill()}
 ctx.restore();
 /* hood */
 f("#090b0e");ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(65,265);ctx.lineTo(415,265);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#30353b";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(65,265);ctx.lineTo(415,265);ctx.stroke();
 /* landmark banner */
 if(S.toast){const a=T-S.toast.t;if(a<4){ctx.globalAlpha=Math.min(1,a,4-a);f("rgba(0,0,0,.6)");ctx.fillRect(150,50,180,30);
  ctx.textAlign="center";f(AC);ctx.font="bold 8px Arial";ctx.fillText("WOODWARD AVE",W/2,62);f("#fff");ctx.font="bold 12px Arial";ctx.fillText(S.toast.n,W/2,75);ctx.globalAlpha=1}}
 if(S.run&&S.waitingForNextSong){f("rgba(0,0,0,.55)");ctx.fillRect(135,16,210,27);f("#fff");ctx.textAlign="center";ctx.font="10px Arial";ctx.fillText("♪ TRACK PLAYING — NEXT BILLBOARD PENDING",W/2,33)}
}
